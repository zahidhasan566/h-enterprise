<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f2d2a">
<title>হেলাল এন্টারপ্রাইজ — হিসাব খাতা</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ec;--card:#fff;--ink:#2b2a28;--mute:#7a756d;--line:#e6e0d6;--acc:#d9622b;--acc2:#fbe9df;--red:#c0392b;--redbg:#fdecea;--green:#1e8449;--greenbg:#e6f5ec;--blue:#2563a8;--bluebg:#e8f0fa;--amber:#9a6700;--amberbg:#fff4d6}
*{box-sizing:border-box}
body{margin:0;font-family:'Hind Siliguri',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5}
.app{display:flex;min-height:100vh}
nav.side{width:232px;background:#2f2d2a;color:#eee;padding:18px 12px;position:sticky;top:0;height:100vh;flex-shrink:0;overflow-y:auto}
.brand{padding:4px 10px 18px;border-bottom:1px solid #46433f;margin-bottom:12px}
.brand b{display:block;font-size:19px;color:#fff}
.brand small{color:#b9b3aa}
nav .tab{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;color:#ddd;cursor:pointer;font-size:16px;border:0;background:none;width:100%;text-align:left;font-family:inherit;margin-bottom:2px}
nav .tab:hover{background:#3d3a36}
nav .tab.active{background:var(--acc);color:#fff}
main{flex:1;padding:22px 26px;min-width:0;max-width:1200px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.topbar h1{margin:0;font-size:22px}
.topbar .date{color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px}
.card h2{margin:0 0 14px;font-size:20px}
.card h3{margin:0 0 10px;font-size:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:default}
.stat .l{color:var(--mute);font-size:14px}
.stat .v{font-size:23px;font-weight:700;margin-top:2px}
.stat.red{background:var(--redbg);border-color:#f3c7c2}.stat.red .v{color:var(--red)}
.stat.green{background:var(--greenbg);border-color:#bfe5cd}.stat.green .v{color:var(--green)}
.stat.blue{background:var(--bluebg);border-color:#c6d9f0}.stat.blue .v{color:var(--blue)}
.stat.amber{background:var(--amberbg);border-color:#f1dea3}.stat.amber .v{color:var(--amber)}
.stat.click{cursor:pointer}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:18px}
.quick button{padding:16px 10px;font-size:17px;border-radius:12px;border:2px solid var(--acc);background:var(--acc2);color:#8a3510;font-family:inherit;font-weight:600;cursor:pointer}
.quick button:hover{background:var(--acc);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
label{display:block;font-weight:500;margin-bottom:10px;font-size:15px}
input,select,textarea{width:100%;padding:10px 11px;border:1px solid #d4ccbf;border-radius:9px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink);margin-top:4px}
input:focus,select:focus{outline:2px solid var(--acc);border-color:var(--acc)}
.row{display:flex;gap:8px;align-items:center}
.row>*{margin-top:4px}
.chk{display:flex;gap:8px;align-items:center;font-weight:500}
.chk input{width:20px;height:20px;margin:0}
fieldset{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 10px}
legend{font-weight:600;padding:0 6px}
small{color:var(--mute)}
.btn{background:var(--acc);color:#fff;border:0;padding:10px 16px;border-radius:9px;font-size:16px;font-family:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(.95)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid #d4ccbf}
.btn.danger{background:var(--red)}
.btn.green{background:var(--green)}
.btn.big{padding:14px 26px;font-size:18px}
.btn.sm{padding:6px 10px;font-size:14px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.mt{margin-top:14px}
.tblwrap{overflow-x:auto;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{background:#f7f3ec;text-align:left;padding:9px 10px;font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:hover td{background:#fcfaf6}
.r{text-align:right;white-space:nowrap}
table.items td{padding:6px}
table.items select{min-width:220px}
table.items input{min-width:80px}
.unitin{display:flex;align-items:center;gap:6px}.unitin span{color:var(--mute);white-space:nowrap;font-size:14px}
.x{background:none;border:0;color:var(--red);font-size:18px;cursor:pointer;padding:8px}
.sumbox{background:#faf7f2;border:1px solid var(--line);border-radius:12px;padding:14px 16px;align-self:start}
.sumbox div{display:flex;justify-content:space-between;padding:4px 0}
.sumbox .big{font-size:19px;border-top:1px dashed #d4ccbf;margin-top:4px;padding-top:8px}
.sumbox hr{border:0;border-top:1px solid var(--line)}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:13px;font-weight:600;background:#eee;color:#555;white-space:nowrap}
.tag.red{background:var(--redbg);color:var(--red)}
.tag.green{background:var(--greenbg);color:var(--green)}
.tag.amber{background:var(--amberbg);color:var(--amber)}
.tag.blue{background:var(--bluebg);color:var(--blue)}
.cred{color:var(--red);font-weight:700}.cgreen{color:var(--green);font-weight:700}
a.link{color:var(--blue);cursor:pointer;text-decoration:none;font-weight:600}
a.link:hover{text-decoration:underline}
.empty{color:var(--mute);text-align:center;padding:18px}
.bars{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;color:var(--mute)}
.bar i{display:block;width:100%;max-width:46px;background:var(--acc);border-radius:6px 6px 0 0;min-height:3px}
.bar b{font-size:11px;color:var(--ink);font-weight:600;margin-bottom:3px;white-space:nowrap}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:900px){.cols2{grid-template-columns:1fr}}
.custhead{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-start}
.custhead .bal{font-size:24px}
.search{max-width:360px}
.modal-bg{position:fixed;inset:0;background:rgba(30,28,25,.55);display:none;align-items:flex-start;justify-content:center;z-index:100;overflow-y:auto;padding:30px 12px}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:560px}
.modal.wide{max-width:760px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#2f2d2a;color:#fff;padding:12px 20px;border-radius:10px;z-index:200;display:none;font-weight:500;max-width:90vw;text-align:center}
.toast.err{background:var(--red)}
.inv{font-size:15px}
.invhead{display:flex;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:10px}
.invhead h2{margin:0;font-size:22px}
.invtitle{font-weight:700;font-size:17px;border:1px solid var(--ink);padding:2px 10px;border-radius:6px;display:inline-block;margin-bottom:4px}
.invto{margin:8px 0 12px}
.invsum{margin-left:auto;max-width:300px;margin-top:10px}
.invsum div{display:flex;justify-content:space-between;padding:3px 0}
.invsum .big{font-weight:700;border-top:1px solid var(--ink);padding-top:6px}
.sign{display:flex;justify-content:space-between;margin-top:46px}
.sign span{border-top:1px solid var(--ink);padding-top:4px;min-width:150px;text-align:center}
.rephead{text-align:center;margin-bottom:12px}
.rephead h2{margin:0}
.daynav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.daynav input{width:auto;margin:0}
.notice{background:var(--amberbg);border:1px solid #f1dea3;color:#6b4c00;padding:10px 14px;border-radius:10px;margin-bottom:16px;font-size:15px}
#printArea{display:none}
@media(max-width:800px){
 .app{flex-direction:column}
 nav.side{width:100%;height:auto;position:sticky;top:0;z-index:50;display:flex;overflow-x:auto;padding:8px;gap:4px}
 .brand{display:none}
 nav .tab{white-space:nowrap;width:auto;padding:8px 12px;font-size:15px;margin:0}
 main{padding:14px}
 .stat .v{font-size:20px}
}
@media print{
 .app,.modal-bg,.toast{display:none!important}
 #printArea{display:block!important;padding:10px}
 body{background:#fff}
 th{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .stats{grid-template-columns:repeat(3,1fr)}
 .card{border:1px solid #999;break-inside:avoid}
 .noprint{display:none!important}
}

.brand{display:flex;gap:10px;align-items:center;border-color:rgba(255,255,255,.12)}
.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#ff8a3d,#e8442e);display:grid;place-items:center;font-size:22px;font-weight:700;color:#fff;box-shadow:0 6px 16px rgba(232,68,46,.45);flex-shrink:0}
nav .tab{color:#d6d9e6;transition:.15s}

.prog{height:8px;background:#eee;border-radius:8px;overflow:hidden;margin-top:4px;min-width:120px}.prog i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#15803d)}

.hero{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:24px 26px;border-radius:20px;margin-bottom:18px;color:#fff;background:radial-gradient(circle at 85% 20%,rgba(255,255,255,.18) 0,transparent 40%),linear-gradient(120deg,#1f2a44 0%,#5b2a86 50%,#e8442e 100%);box-shadow:0 14px 34px rgba(91,42,134,.30)}

.hgreet,.hsub{opacity:.88}.hsub{font-size:15px}

.card{border:0;box-shadow:0 4px 18px rgba(40,30,20,.07);border-radius:16px}

.stat::after{content:'';position:absolute;right:-26px;top:-26px;width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.18)}

.stat.blue,.stat.green,.stat.red,.stat.amber,.stat.blue .v,.stat.green .v,.stat.red .v,.stat.amber .v{color:#fff}

.quick button:nth-child(1){background:linear-gradient(135deg,#ff7a2f,#e8442e)}
.quick button:nth-child(2){background:linear-gradient(135deg,#22c55e,#0f766e)}
.quick button:nth-child(3){background:linear-gradient(135deg,#8b5cf6,#6d28d9)}
.quick button:nth-child(4){background:linear-gradient(135deg,#3b82f6,#1e40af)}
.quick button:hover{transform:translateY(-3px);color:#fff;filter:brightness(1.07)}
.btn{background:linear-gradient(135deg,#ff7a2f,#e8442e);box-shadow:0 4px 12px rgba(232,68,46,.25)}
.btn.green{background:linear-gradient(135deg,#22c55e,#15803d);box-shadow:0 4px 12px rgba(21,128,61,.25)}
.btn.danger{background:linear-gradient(135deg,#f43f5e,#be123c)}
.btn.ghost{background:#fff;box-shadow:none}
.bar i{background:linear-gradient(180deg,#ff9a4d,#e8442e)}
th{background:linear-gradient(90deg,#fff1e8,#f6eefe)}
.sumbox{background:linear-gradient(135deg,#fff7f0,#f6f0ff);border:0}
.modal{border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
@media(max-width:800px){.hero{padding:18px}.hero h2{font-size:24px}.hfig{text-align:left;width:100%}}
@media print{.stat{color:#000!important;background:#fff!important;border:1px solid #999}.stat .v,.stat .l,.stat small{color:#000!important}}

<script>

function delivState(i){const q=sum(i.items,x=>x.qty),d=sum(i.items,x=>x.delivered||0);return d>=q-1e-9?'done':d<=0?'none':'part'}
function delivTag(i){const st=delivState(i);return st==='done'?'<span class="tag green">✔ মাল দেওয়া শেষ</span>':st==='part'?'<span class="tag blue">🚚 আংশিক ডেলিভারি</span>':'<span class="tag amber">⏳ মাল যায়নি</span>'}

// পুরনো বাকি আগে, তারপর পুরনো বিল — এভাবে জমা টাকা মেলানো হয় (FIFO)
function custCalc(cid){
 const c=getC(cid);if(!c)return{due:0,advance:0,balance:0,pending:{},oldDue:0};
 const op=+c.opening||0;
 const invs=S.invoices.filter(i=>i.cid===cid).sort((a,b)=>a.date.localeCompare(b.date)||a.ts-b.ts);
 let credit=sum(S.payments.filter(p=>p.cid===cid),p=>p.amount)+Math.max(-op,0);
 const debits=[];
 if(op>0)debits.push({type:'op',amt:op});
 invs.forEach(i=>{const a=i.total-(i.discount||0)-(i.paid||0);if(a<0)credit+=-a;else debits.push({type:'inv',inv:i,amt:a})});
 const pending={};let due=0,oldDue=0;
 debits.forEach(d=>{const ap=Math.min(credit,d.amt);credit-=ap;const r=d.amt-ap;if(d.type==='inv')pending[d.inv.id]=r;else oldDue=r;due+=r});
 return{due,advance:credit,balance:due-credit,pending,oldDue};
}
function invRemain(inv){if(!inv.cid)return Math.max(0,inv.total-inv.discount-inv.paid);return custCalc(inv.cid).pending[inv.id]||0}
function dayReport(d){
 const invs=S.invoices.filter(i=>i.date===d).sort((a,b)=>a.ts-b.ts);
 const pays=S.payments.filter(p=>p.date===d).sort((a,b)=>a.ts-b.ts);
 const exps=S.expenses.filter(e=>e.date===d);
 const sales=sum(invs,i=>i.total-i.discount);
 const cashSale=sum(invs,i=>i.paid);
 const coll=sum(pays,p=>p.amount);
 const exp=sum(exps,e=>e.amount);
 const credit=sum(invs,i=>Math.max(0,i.total-i.discount-i.paid));
 const items={};
 invs.forEach(i=>i.items.forEach(x=>{const k=x.pid;items[k]=items[k]||{name:x.name,unit:x.unit,qty:0,amt:0};items[k].qty+=x.qty;items[k].amt+=x.qty*x.rate}));
 return{invs,pays,exps,sales,cashSale,coll,exp,credit,cashIn:cashSale+coll,net:cashSale+coll-exp,items:Object.values(items)};
}

 </div>`;

function saleRowsHtml(){return sale.rows.map((r,i)=>{const p=getP(r.pid);
 return `<tr><td><select onchange="setRowP(${i},this.value)"><option value="">— মাল বাছাই করুন —</option>${S.products.map(x=>`<option value="${x.id}" ${x.id===r.pid?'selected':''}>${esc(x.name)} (স্টক ${num(x.stock)} ${esc(x.unit)})</option>`).join('')}</select></td>
 <td><div class="unitin"><input inputmode="decimal" value="${esc(r.qty)}" oninput="sale.rows[${i}].qty=this.value;updSale()" placeholder="০"><span>${p?esc(p.unit):''}</span></div></td>
 <td><input inputmode="decimal" value="${esc(r.rate)}" oninput="sale.rows[${i}].rate=this.value;updSale()"></td>
 <td class="r" id="lt${i}"></td>
 <td>${sale.rows.length>1?`<button class="x" title="বাদ দিন" onclick="sale.rows.splice(${i},1);refreshRows()">✕</button>`:''}</td></tr>`}).join('')}
function refreshRows(){document.getElementById('sRows').innerHTML=saleRowsHtml();labelTables(document.getElementById('main'));updSale()}
function setRowP(i,pid){const p=getP(pid);sale.rows[i].pid=pid;if(p)sale.rows[i].rate=String(p.price);refreshRows()}
function saleTotals(){const gross=sum(sale.rows,r=>parseN(r.qty)*parseN(r.rate));const disc=parseN(sale.discount);return{gross,disc,net:gross-disc,paid:parseN(sale.paid)}}
function updSale(){
 const t=saleTotals();
 sale.rows.forEach((r,i)=>{const e=document.getElementById('lt'+i);if(e)(e.querySelector('.tdv')||e).textContent=tk(parseN(r.qty)*parseN(r.rate))});
 const prev=sale.cid?custCalc(sale.cid).balance:0,after=prev+t.net-t.paid;
 const el=document.getElementById('sSum');if(!el)return;
 el.innerHTML=`<div><span>মালের দাম</span><b>${tk(t.gross)}</b></div><div><span>ছাড়</span><b>${tk(t.disc)}</b></div>
 <div class="big"><span>এই বিলের মোট</span><b>${tk(t.net)}</b></div><div><span>নগদ পেলাম</span><b>${tk(t.paid)}</b></div>
 <div><span>এই বিলে বাকি</span><b class="${t.net-t.paid>0.5?'cred':''}">${tk(Math.max(0,t.net-t.paid))}</b></div>
 ${sale.cid?`<hr><div><span>আগের হিসাব</span><b>${balTxt(prev)}</b></div><div class="big"><span>সব মিলিয়ে দাঁড়াবে</span><b>${balTxt(after)}</b></div>${prev<-0.5?'<small>✔ কাস্টমারের অগ্রিম টাকা থেকে এই বিল আপনাআপনি কাটা যাবে</small>':''}`:`<hr><small>খাতার কাস্টমার না হলে পুরো টাকা নগদ নিতে হবে</small>`}`;
}
function saveSale(){
 const rows=sale.rows.filter(r=>r.pid&&parseN(r.qty)>0);
 if(!rows.length)return toast('অন্তত একটি মাল ও তার পরিমাণ দিন','err');
 const t=saleTotals();
 if(t.net<0)return toast('ছাড় মোট দামের চেয়ে বেশি হতে পারে না','err');
 if(!sale.cid&&t.paid<t.net-0.5)return toast('নগদ ক্রেতার বাকি রাখা যায় না — খাতার কাস্টমার বাছাই করুন','err');
 const need={};rows.forEach(r=>need[r.pid]=(need[r.pid]||0)+parseN(r.qty));
 if(!sale.dp)for(const pid in need){const p=getP(pid);if(p.stock<need[pid]&&!confirm(`${p.name} স্টকে আছে মাত্র ${num(p.stock)} ${p.unit}। তবুও সেভ করবেন?`))return}
 const inv={id:uid(),no:++S.seq,date:sale.date,cid:sale.cid,items:rows.map(r=>{const p=getP(r.pid);return{pid:p.id,name:p.name,unit:p.unit,qty:parseN(r.qty),rate:parseN(r.rate),delivered:sale.dp?0:parseN(r.qty)}}),deliveries:[],discount:t.disc,paid:sale.cid?t.paid:Math.min(t.paid,t.net),deliveryPending:sale.dp,note:sale.note,ts:Date.now()};
 inv.total=sum(inv.items,i=>i.qty*i.rate);
 inv.items.forEach(i=>{getP(i.pid).stock-=i.delivered});
 S.invoices.push(inv);save();resetSale(true);render();showInvoice(inv.id);toast('✔ বিক্রি সেভ হয়েছে');
}

 <label>পুরনো খাতার পৃষ্ঠা নং<input id="cPage" value="${esc(c.page)}" placeholder="কাগজের খাতায় কত পৃষ্ঠায় আছে"></label>
 <fieldset><legend>পুরনো খাতার জের (আগের হিসাব)</legend><div class="row"><select id="cOpT" style="max-width:190px"><option value="due" ${c.opening>=0?'selected':''}>বাকি আছে</option><option value="adv" ${c.opening<0?'selected':''}>অগ্রিম দেওয়া আছে</option></select><input id="cOp" inputmode="decimal" value="${c.opening?Math.abs(c.opening):''}" placeholder="০"></div>
 <small>কাগজের খাতায় এই কাস্টমারের আগের যত টাকা বাকি বা অগ্রিম, সেটা এখানে লিখুন। নতুন হিসাব এখান থেকে শুরু হবে।</small></fieldset>
 <div class="actions"><button class="btn" onclick="saveCust('${id||''}','${from||''}')">সেভ করুন</button>${id?`<button class="btn danger" onclick="delCust('${id}')">মুছুন</button>`:''}<button class="btn ghost" onclick="closeModal()">বাতিল</button></div>`);
 setTimeout(()=>document.getElementById('cName').focus(),50);
}
function saveCust(id,from){
 const name=document.getElementById('cName').value.trim();if(!name)return toast('নাম লিখুন','err');
 const op=parseN(document.getElementById('cOp').value)*(document.getElementById('cOpT').value==='adv'?-1:1);
 const d={name,phone:document.getElementById('cPhone').value.trim(),place:document.getElementById('cPlace').value.trim(),page:document.getElementById('cPage').value.trim(),opening:op};
 let cid=id;
 if(id)Object.assign(getC(id),d);else{cid=uid();S.customers.push({id:cid,...d})}
 if(from==='sale')sale.cid=cid;if(from==='pay')pay.cid=cid;
 save();closeModal();render();toast('✔ কাস্টমার সেভ হয়েছে');
}
function delCust(id){
 if(S.invoices.some(i=>i.cid===id)||S.payments.some(p=>p.cid===id))return toast('এই কাস্টমারের লেনদেন আছে — মোছা যাবে না','err');
 if(!confirm('কাস্টমার মুছে ফেলবেন?'))return;S.customers=S.customers.filter(c=>c.id!==id);save();closeModal();render();
}
function ledgerEntries(c){
 const ent=[];
 if(+c.opening)ent.push({date:'',ts:0,desc:'পুরনো খাতার জের'+(c.page?` (পৃষ্ঠা ${bn(c.page)})`:''),dr:c.opening>0?c.opening:0,cr:c.opening<0?-c.opening:0});
 S.invoices.filter(i=>i.cid===c.id).forEach(i=>{
  ent.push({date:i.date,ts:i.ts,desc:`<a class="link" onclick="showInvoice('${i.id}')">বিল #${bn(i.no)}</a>: `+i.items.map(x=>`${esc(x.name)} ${num(x.qty)} ${esc(x.unit)} × ${num(x.rate)}`).join(', ')+(i.discount?` (ছাড় ${tk(i.discount)})`:'')+(i.deliveryPending?' '+delivTag(i):''),dr:i.total-i.discount,cr:0});
  if(i.paid)ent.push({date:i.date,ts:i.ts+0.5,desc:`বিল #${bn(i.no)} — নগদ জমা`,dr:0,cr:i.paid});
 });
 S.payments.filter(p=>p.cid===c.id).forEach(p=>ent.push({date:p.date,ts:p.ts,desc:`জমা — ${p.kind} (${esc(p.method)})${p.note?' · '+esc(p.note):''}`,dr:0,cr:p.amount}));
 ent.sort((a,b)=>(a.date||'').localeCompare(b.date||'')||a.ts-b.ts);
 let bal=0;ent.forEach(e=>{bal+=e.dr-e.cr;e.bal=bal});
 return ent;
}
function ledgerTable(c){
 const ent=ledgerEntries(c);
 return `<div class="tblwrap"><table><thead><tr><th>তারিখ</th><th>বিবরণ</th><th class="r">মাল নিয়েছে</th><th class="r">জমা</th><th class="r">জের</th></tr></thead><tbody>
 ${ent.map(e=>`<tr><td>${fd(e.date)||'—'}</td><td>${e.desc}</td><td class="r">${e.dr?tk(e.dr):''}</td><td class="r cgreen">${e.cr?tk(e.cr):''}</td><td class="r">${balTxt(e.bal)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">এখনো কোনো লেনদেন নেই</td></tr>'}
 </tbody></table></div>`;
}

 <div class="card"><h3>খাতার হিসাব</h3>${ledgerTable(c)}</div>`;

function printLedger(cid){const c=getC(cid),k=custCalc(cid);printHtml(`<div class="rephead"><h2>${esc(S.shop.name)}</h2><div>কাস্টমার খাতা — ${esc(c.name)} (${esc(c.place)}) · ${fd(isoToday())}</div><h3>বর্তমান হিসাব: ${balTxt(k.balance)}</h3></div>`+ledgerTable(c))}

 ${pend.map(x=>`<tr><td><a class="link" onclick="showInvoice('${x.i.id}')">#${bn(x.i.no)}</a></td><td>${fd(x.i.date)}</td><td><a class="link" onclick="go('ledger',{cid:'${x.c.id}'})">${esc(x.c.name)}</a></td><td class="r">${tk(x.i.total-x.i.discount)}</td><td class="r cred">${tk(x.rem)}</td><td>${age(x.i.date)}</td><td class="r"><button class="btn green sm" onclick="pay.cid='${x.c.id}';go('pay')">জমা নিন</button></td></tr>`).join('')}
 ${!pend.length&&!oldDues.length?'<tr><td colspan="7" class="empty">কোনো পেন্ডিং বিল নেই 🎉</td></tr>':''}</tbody></table></div></div>

function saveProd(id){

 openModal(`<h3>মাল এসেছে — ${esc(p.name)}</h3><p>বর্তমান স্টক: <b>${num(p.stock)} ${esc(p.unit)}</b></p>

 <div class="tblwrap"><table><thead><tr><th>বিবরণ</th><th class="r">টাকা</th><th></th></tr></thead><tbody>
 ${list.map(e=>`<tr><td>${esc(e.title)}</td><td class="r">${tk(e.amount)}</td><td class="r"><button class="x" onclick="delExp('${e.id}')">✕</button></td></tr>`).join('')||'<tr><td colspan="3" class="empty">এই দিনে কোনো খরচ নেই</td></tr>'}
 <tr><td><b>মোট খরচ</b></td><td class="r"><b>${tk(sum(list,e=>e.amount))}</b></td><td></td></tr></tbody></table></div></div>`;
}
function saveExp(){const t=document.getElementById('eTitle').value.trim(),a=parseN(document.getElementById('eAmt').value);if(!t||a<=0)return toast('বিবরণ ও টাকা দিন','err');const d=document.getElementById('eDate').value;S.expenses.push({id:uid(),date:d,title:t,amount:a});expDate=d;save();render();toast('✔ খরচ যোগ হয়েছে')}
function delExp(id){if(!confirm('খরচটি মুছবেন?'))return;S.expenses=S.expenses.filter(e=>e.id!==id);save();render()}

/* ============ দৈনিক রিপোর্ট ============ */
function reportHtml(d){
 const r=dayReport(d);
 const allDue=sum(S.customers,c=>custCalc(c.id).due);
 return `<div class="rephead"><h2>${esc(S.shop.name)}</h2><div>দৈনিক হিসাব রিপোর্ট — <b>${fd(d)}</b></div></div>
 <div class="stats">
  <div class="stat blue"><div class="l">মোট বিক্রি</div><div class="v">${tk(r.sales)}</div><small>${bn(r.invs.length)} টি বিল</small></div>
  <div class="stat"><div class="l">বিক্রিতে নগদ পেয়েছি</div><div class="v">${tk(r.cashSale)}</div></div>
  <div class="stat red"><div class="l">বাকিতে বিক্রি</div><div class="v">${tk(r.credit)}</div></div>
  <div class="stat green"><div class="l">বাকি আদায় / অগ্রিম</div><div class="v">${tk(r.coll)}</div><small>${bn(r.pays.length)} টি জমা</small></div>
  <div class="stat green"><div class="l">মোট ক্যাশ এসেছে</div><div class="v">${tk(r.cashIn)}</div></div>
  <div class="stat"><div class="l">খরচ</div><div class="v">${tk(r.exp)}</div></div>
  <div class="stat blue"><div class="l">আজ বুকিংয়ের মাল দেওয়া হলো</div><div class="v">${bn(S.invoices.reduce((n,i)=>n+(i.deliveries||[]).filter(x=>x.date===d).length,0))} টি চালান</div><small>${S.invoices.flatMap(i=>(i.deliveries||[]).filter(x=>x.date===d).map(x=>x.items.map(y=>esc(y.name)+' '+num(y.qty)).join(', '))).join(' · ')||'—'}</small></div>
  <div class="stat amber"><div class="l">দিন শেষে হাতে থাকার কথা</div><div class="v">${tk(r.net)}</div><small>ক্যাশ − খরচ</small></div>
  <div class="stat red"><div class="l">আজ পর্যন্ত মোট বাজার বাকি</div><div class="v">${tk(allDue)}</div></div>
 </div>
 <div class="card"><h3>কোন মাল কত বিক্রি হলো</h3><div class="tblwrap"><table><thead><tr><th>মাল</th><th class="r">পরিমাণ</th><th class="r">টাকা</th></tr></thead><tbody>
 ${r.items.map(x=>`<tr><td>${esc(x.name)}</td><td class="r">${num(x.qty)} ${esc(x.unit)}</td><td class="r">${tk(x.amt)}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">কোনো বিক্রি নেই</td></tr>'}</tbody></table></div></div>
 <div class="card"><h3>বিক্রির বিল</h3><div class="tblwrap"><table><thead><tr><th>বিল</th><th>ক্রেতা</th><th class="r">মোট</th><th class="r">নগদ</th><th class="r">বাকি</th></tr></thead><tbody>
 ${r.invs.map(i=>`<tr><td>#${bn(i.no)}</td><td>${i.cid?esc(getC(i.cid)?.name):'নগদ ক্রেতা'}</td><td class="r">${tk(i.total-i.discount)}</td><td class="r">${tk(i.paid)}</td><td class="r">${tk(Math.max(0,i.total-i.discount-i.paid))}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">—</td></tr>'}</tbody></table></div></div>
 <div class="cols2"><div class="card"><h3>টাকা জমা</h3><div class="tblwrap"><table><tbody>
 ${r.pays.map(p=>`<tr><td>${esc(getC(p.cid)?.name)}<br><small>${p.kind} · ${esc(p.method)}</small></td><td class="r">${tk(p.amount)}</td></tr>`).join('')||'<tr><td class="empty">—</td></tr>'}</tbody></table></div></div>
 <div class="card"><h3>খরচ</h3><div class="tblwrap"><table><tbody>
 ${r.exps.map(e=>`<tr><td>${esc(e.title)}</td><td class="r">${tk(e.amount)}</td></tr>`).join('')||'<tr><td class="empty">—</td></tr>'}</tbody></table></div></div></div>`;
}
function pgReport(){
 return `<div class="card noprint"><div class="daynav"><b>তারিখ:</b><button class="btn ghost sm" onclick="reportDate=addDays(reportDate,-1);render()">◀ আগের দিন</button>
 <input type="date" value="${reportDate}" onchange="reportDate=this.value;render()"><button class="btn ghost sm" onclick="reportDate=addDays(reportDate,1);render()">পরের দিন ▶</button>
 <button class="btn ghost sm" onclick="reportDate=isoToday();render()">আজ</button><button class="btn" onclick="printHtml(reportHtml(reportDate))">🖨️ প্রিন্ট</button></div></div>`+reportHtml(reportDate);
}

/* ============ বিক্রির ইতিহাস ============ */
function pgHistory(){
 const q=histQ.trim().toLowerCase();
 const list=S.invoices.filter(i=>i.date>=histFrom&&i.date<=histTo).filter(i=>{if(!q)return true;const c=getC(i.cid);return((c?c.name+c.place:'নগদ ক্রেতা')+' '+i.no+' '+bn(i.no)).toLowerCase().includes(q)}).sort((a,b)=>b.date.localeCompare(a.date)||b.ts-a.ts);
 const st=i=>payTag(i);
 return `<div class="card"><div class="daynav" style="margin-bottom:12px"><input class="search" placeholder="🔍 কাস্টমার বা বিল নং" value="${esc(histQ)}" onchange="histQ=this.value;render()">
 <span>থেকে</span><input type="date" value="${histFrom}" onchange="histFrom=this.value;render()"><span>পর্যন্ত</span><input type="date" value="${histTo}" onchange="histTo=this.value;render()"></div>
 <div class="stats"><div class="stat blue"><div class="l">এই সময়ে বিক্রি</div><div class="v">${tk(sum(list,i=>i.total-i.discount))}</div><small>${bn(list.length)} টি বিল</small></div><div class="stat red"><div class="l">এখনো বাকি</div><div class="v">${tk(sum(list,invRemain))}</div></div></div>
 <div class="tblwrap"><table><thead><tr><th>বিল</th><th>তারিখ</th><th>কাস্টমার</th><th>মাল</th><th class="r">মোট</th><th class="r">বাকি</th><th>অবস্থা</th></tr></thead><tbody>
 ${list.map(i=>`<tr><td><a class="link" onclick="showInvoice('${i.id}')">#${bn(i.no)}</a></td><td>${fd(i.date)}</td><td>${i.cid?`<a class="link" onclick="go('ledger',{cid:'${i.cid}'})">${esc(getC(i.cid)?.name)}</a>`:'নগদ ক্রেতা'}</td><td><small>${i.items.map(x=>`${esc(x.name)} ${num(x.qty)} ${esc(x.unit)}`).join(', ')}</small></td><td class="r">${tk(i.total-i.discount)}</td><td class="r">${tk(invRemain(i))}</td><td>${st(i)}<br>${delivTag(i)}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">এই সময়ে কোনো বিল নেই</td></tr>'}
 </tbody></table></div></div>`;
}

/* ============ সেটিংস ============ */
function settingsModal(){
 openModal(`<h3>⚙️ সেটিংস</h3><label>দোকানের নাম<input id="shName" value="${esc(S.shop.name)}"></label><label>ঠিকানা<input id="shAddr" value="${esc(S.shop.address)}"></label><label>মোবাইল<input id="shPhone" value="${esc(S.shop.phone)}"></label>
 <div class="actions"><button class="btn" onclick="S.shop={name:document.getElementById('shName').value,address:document.getElementById('shAddr').value,phone:document.getElementById('shPhone').value};save();closeModal();render();toast('✔ সেভ হয়েছে')">সেভ করুন</button></div>
 <fieldset class="mt"><legend>ব্যাকআপ</legend><small>এই ডেমোতে সব হিসাব এই ব্রাউজারেই থাকে। মাঝে মাঝে ব্যাকআপ ফাইল নামিয়ে রাখুন।</small>
 <div class="actions"><button class="btn ghost" onclick="exportData()">⬇ ব্যাকআপ নামান</button><label class="btn ghost" style="margin:0">⬆ ব্যাকআপ থেকে ফেরত<input type="file" accept=".json" style="display:none" onchange="importData(this)"></label></div></fieldset>
 <fieldset><legend>ডেমো</legend><div class="actions"><button class="btn danger" onclick="if(confirm('সব ডেটা মুছে ডেমো ডেটা আবার বসানো হবে। নিশ্চিত?')){S=seed();save();closeModal();go('dash');toast('ডেমো ডেটা রিসেট হয়েছে')}">ডেমো ডেটা রিসেট</button>
 <button class="btn danger" onclick="if(confirm('সব ডেটা মুছে একদম খালি খাতা শুরু হবে। নিশ্চিত?')){const s=seed();S={...s,seq:0,customers:[],invoices:[],payments:[],expenses:[],stockLog:[],products:s.products.map(p=>({...p,stock:0}))};save();closeModal();go('dash')}">খালি খাতা শুরু</button></div></fieldset>
 <div class="actions"><button class="btn ghost" onclick="closeModal()">বন্ধ</button></div>`);
}
function exportData(){const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='dokan-backup-'+isoToday()+'.json';a.click()}
function importData(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.customers||!d.invoices)throw 0;S=d;save();closeModal();go('dash');toast('✔ ব্যাকআপ থেকে ফেরত আনা হয়েছে')}catch(e){toast('ফাইলটি সঠিক নয়','err')}};r.readAsText(f)}

/* ============ মোডাল, টোস্ট, প্রিন্ট ============ */
function openModal(html,wide){const m=document.getElementById('modal');m.className='modal'+(wide?' wide':'');m.innerHTML=html;labelTables(m);document.getElementById('modalBg').classList.add('show')}
function closeModal(){document.getElementById('modalBg').classList.remove('show')}
function toast(msg,type){const t=document.getElementById('toast');t.textContent=msg;t.className='toast'+(type?' '+type:'');t.style.display='block';clearTimeout(window._tt);window._tt=setTimeout(()=>t.style.display='none',3200)}
function printHtml(html){document.getElementById('printArea').innerHTML=html;window.print()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

const PAGES={dash:pgDash,sale:pgSale,pay:pgPay,cust:pgCust,ledger:pgLedger,pending:pgPending,stock:pgStock,exp:pgExp,report:pgReport,history:pgHistory};
render();
</script>
